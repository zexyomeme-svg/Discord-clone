name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-clone-src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: discord-clone-src/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: TypeScript (strict, no emit)
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify the single-file bundle was produced
        run: test -s dist/index.html

      - name: Dependency audit (documented allowlist)
        run: npm run audit:review

  backend:
    name: Backend (Flask tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-clone-src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: discord-clone-src/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Byte-compile the entrypoints
        run: python -m py_compile run.py build_frontend.py

      - name: Run pytest
        run: python -m pytest tests -v
