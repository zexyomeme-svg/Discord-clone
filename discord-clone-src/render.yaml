services:
  - type: web
    name: discord-clone-render
    env: python
    plan: free
    # Node 20 reached end-of-life in April 2026; the nodeenv fallback installs
    # the current Node 22 LTS instead.
    buildCommand: |
      pip install -r requirements.txt
      python build_frontend.py --build-only
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: NODE_VERSION
        value: 22.22.3
      - key: BACKGROUND_BUILD
        value: "1"
      - key: AUTO_BUILD_FRONTEND
        value: "1"
      # Off by default: with dist/ present there is nothing to check, and this
      # would otherwise spawn a subprocess per Gunicorn worker on every boot.
      - key: RUN_STARTUP_CHECKS
        value: "0"
      # Sign the one-time OAuth2 handoff cookie. Generate with:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      # If unset, run.py generates one and persists it to .flask_secret_key,
      # which only works while the filesystem survives between deploys.
      - key: SECRET_KEY
        generateValue: true
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_OAUTH_SCOPES
        value: identify email guilds
      # REQUIRED for OAuth2: the public address of this service. Without it the
      # server cannot build a redirect URI from a trusted source and OAuth2
      # login fails closed with an explanatory 503.
      - key: PUBLIC_BASE_URL
        sync: false
      # Leave CORS locked to same-origin. Only set this if you deliberately host
      # the frontend on a different origin.
      - key: CORS_ORIGINS
        value: ""
      # Attribution, served by GET /api/app-info and rendered two ways: as
      # clickable links in the app UI, and as the bot's plain-text Discord
      # custom status. All are read at request time, so changing one only needs
      # a redeploy — never a frontend rebuild.
      - key: APP_NAME
        value: Disclone
      # APP_VERSION is deliberately not declared: run.py defaults it in step
      # with package.json, and a pinned copy here would silently drift.
      # APP_GITHUB_URL already points at this repository.
      - key: APP_GITHUB_URL
        value: https://github.com/zexyomeme-svg/Discord-clone
      # APP_SITE_URL is also not declared: it falls back to PUBLIC_BASE_URL,
      # which OAuth2 already requires to be this service's public address.
      # Leave APP_PRESENCE_TEXT blank to let the server compose the status from
      # the two URLs; set it to pin the exact text and lock out in-app editing.
      - key: APP_PRESENCE_TEXT
        value: ""
