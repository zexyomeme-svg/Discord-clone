# Render Blueprint.
#
# This file lives at the repository root on purpose: that is where Render looks
# for a Blueprint by default, so setting up the service needs no custom
# "Blueprint Path". It previously sat in discord-clone-src/, which Render only
# finds if you configure that path by hand.
#
# The service builds from the same Dockerfile Railway builds from, so both hosts
# produce an identical image and cannot drift. Language versions are pinned by
# the Dockerfile's FROM lines rather than by PYTHON_VERSION / NODE_VERSION here,
# which a Docker runtime ignores.
services:
  - type: web
    name: discord-clone-render
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # Only rebuild when something the image actually contains has changed.
    # Paths are relative to the repository root.
    buildFilter:
      paths:
        - discord-clone-src/**
        - Dockerfile
        - .dockerignore
        - render.yaml
    envVars:
      # Signs the one-time OAuth2 handoff cookie. Generate your own with:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      #
      # Set it explicitly rather than relying on the generated file: Render's
      # filesystem is ephemeral, so a redeploy otherwise invalidates any
      # in-flight login. run.py now resolves ONE key shared by every Gunicorn
      # worker (falling back to /tmp on a read-only filesystem), so the image can
      # safely run multiple workers either way.
      - key: SECRET_KEY
        generateValue: true

      # OAuth2 is zero-config now. Left empty on purpose: run.py derives the
      # public URL from RENDER_EXTERNAL_URL, which Render injects for every web
      # service. Set this ONLY for a custom domain or a preview environment
      # whose address differs from the injected one.
      - key: PUBLIC_BASE_URL
        value: ""

      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_OAUTH_SCOPES
        value: identify email guilds

      # Leave CORS locked to same-origin. Only set this if you deliberately host
      # the frontend on a different origin.
      - key: CORS_ORIGINS
        value: ""

      # Attribution, served by GET /api/app-info and rendered two ways: as
      # clickable links in the app UI, and as the bot's plain-text Discord
      # custom status. Read per request, so changing one needs a redeploy, never
      # a frontend rebuild.
      - key: APP_NAME
        value: Disclone
      # APP_VERSION is deliberately not declared: run.py defaults it in step with
      # package.json, and a pinned copy here would silently drift.
      # APP_GITHUB_URL already points at this repository.
      - key: APP_GITHUB_URL
        value: https://github.com/zexyomeme-svg/Discord-clone
      # APP_SITE_URL is also not declared: it falls back to PUBLIC_BASE_URL, and
      # therefore to RENDER_EXTERNAL_URL — so a fork advertises its own
      # deployment instead of this one.
      # Leave APP_PRESENCE_TEXT blank to let the server compose the status from
      # those URLs; set it to pin the exact text and lock out in-app editing.
      - key: APP_PRESENCE_TEXT
        value: ""

      # Worker count. The Dockerfile defaults to 2; Render's free tier is
      # 512 MB, which is comfortable for this app at 2 workers x 4 threads.
      - key: WEB_CONCURRENCY
        value: "2"
